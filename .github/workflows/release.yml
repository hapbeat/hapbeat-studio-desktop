name: Release (Windows installer)

# Builds the installer and uploads it, with the auto-update metadata (latest.yml),
# to a DRAFT GitHub Release. Nothing reaches users until the draft is published by
# hand after checking the installer on a real PC with a Hapbeat (the app's
# auto-update only sees published releases).
#
#   push tag vX.Y.Z      → draft release vX.Y.Z
#   workflow_dispatch    → build only (installer as a workflow artifact)
#
# The bundled helper is the PyPI version in helper/helper-version.txt.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != package.json v$version" }

      - name: Build bundled helper
        shell: pwsh
        run: ./helper/build-helper.ps1 -Python python

      - run: npm ci
      - run: npm test

      - name: Build installer (draft release on tags)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref }}".StartsWith('refs/tags/v')) { npx electron-builder --win nsis --publish always }
          else { npx electron-builder --win nsis --publish never }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          if-no-files-found: error
