name: Release (Windows installer)

# Builds the installer and uploads it, with the auto-update metadata (latest.yml),
# to a DRAFT GitHub Release. Nothing reaches users until the draft is published by
# hand after checking the installer on a real PC with a Hapbeat (the app's
# auto-update only sees published releases).
#
#   push tag vX.Y.Z      → draft release vX.Y.Z
#   workflow_dispatch    → build only (installer as a workflow artifact)
#
# The bundled helper is the PyPI version in helper/helper-version.txt.
#
# Code signing (Azure Artifact Signing) is used when the repository has these set:
#   variables: AZURE_SIGNING_ENDPOINT (e.g. https://jpe.codesigning.azure.net),
#              AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
#              AZURE_SIGNING_PUBLISHER (the certificate's subject CN = the legal company name)
#   secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration
#              with the "Artifact Signing Certificate Profile Signer" role on the profile)
# Without them the installer is built unsigned (SmartScreen warns on first run).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check tag (release vX.Y.Z only, equal to package.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Development versions (0.1.0-d1) must never become a release: installed apps
          # would be offered them as updates.
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') { throw "tag ${{ github.ref_name }} is not vX.Y.Z" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != package.json v$version" }

      - name: Build bundled helper
        shell: pwsh
        run: ./helper/build-helper.ps1 -Python python

      - run: npm ci
      - run: npm test

      # The copy of Studio the installer opens without a network (needs precache.json on
      # studio.hapbeat.com).
      - name: Studio copy for offline use
        run: node scripts/fetch-studio-snapshot.mjs

      - name: Build installer (draft release on tags)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $builderArgs = @('--win', 'nsis')
          if ($env:SIGN_ACCOUNT -and $env:AZURE_CLIENT_SECRET) {
            $builderArgs += @(
              "-c.win.azureSignOptions.endpoint=$env:SIGN_ENDPOINT",
              "-c.win.azureSignOptions.codeSigningAccountName=$env:SIGN_ACCOUNT",
              "-c.win.azureSignOptions.certificateProfileName=$env:SIGN_PROFILE",
              "-c.win.azureSignOptions.publisherName=$env:SIGN_PUBLISHER"
            )
          } else {
            Write-Warning 'Code signing is not configured: the installer is unsigned.'
          }
          $publish = if ("${{ github.ref }}".StartsWith('refs/tags/v')) { 'always' } else { 'never' }
          npx electron-builder @builderArgs --publish $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          if-no-files-found: error
