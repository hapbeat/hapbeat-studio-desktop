name: Release (Windows installer)

# Builds the installer and uploads it, with the auto-update metadata (latest.yml),
# to a DRAFT GitHub Release. Nothing reaches users until the draft is published by
# hand after checking the installer on a real PC with a Hapbeat (the app's
# auto-update only sees published releases).
#
#   push tag vX.Y.Z      → draft release vX.Y.Z
#   workflow_dispatch    → build only (installer as a workflow artifact)
#
# The bundled helper is the PyPI version in helper/helper-version.txt.
# The installer is not code-signed (DEC-094: no running cost for a small set of users).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check tag (release vX.Y.Z only, equal to package.json)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Development versions (0.1.0-d1) must never become a release: installed apps
          # would be offered them as updates.
          if ("${{ github.ref_name }}" -notmatch '^v\d+\.\d+\.\d+$') { throw "tag ${{ github.ref_name }} is not vX.Y.Z" }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != package.json v$version" }

      - name: Build bundled helper
        shell: pwsh
        run: ./helper/build-helper.ps1 -Python python

      - run: npm ci
      - run: npm test

      # The copy of Studio the installer opens without a network (needs precache.json on
      # studio.hapbeat.com).
      - name: Studio copy for offline use
        run: node scripts/fetch-studio-snapshot.mjs

      # electron-builder uploads its files in parallel and, when no release exists yet,
      # each upload creates one: v0.1.0 ended up as two drafts (installer + latest.yml
      # in one, the blockmap in the other). Create the draft first so all go into it.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            $version = "${{ github.ref_name }}".TrimStart('v')
            gh release create "${{ github.ref_name }}" --draft --title $version --notes "Hapbeat Studio for Windows $version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer (draft release on tags)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publish = if ("${{ github.ref }}".StartsWith('refs/tags/v')) { 'always' } else { 'never' }
          npx electron-builder --win nsis --publish $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*.exe
          if-no-files-found: error
